<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Créditos</title>
</head>
<body>

<header>
    <h1>Sistema Básico de Créditos</h1>
    <link rel="stylesheet" href="simulador_completo.css">
</header>

<nav>
    <button onclick="mostrarSeccion('parametros')">Parámetros</button>
    <button onclick="mostrarSeccion('clientes')">Clientes</button>
    <button onclick="mostrarSeccion('credito')">Crédito</button>
    <button onclick="mostrarSeccion('Datos')" >Datos del Desarrollador</button>

</nav>
<section id="Datos">
  <h2>Información del Desarrollador</h2>
  <h3>
    Soy Juan Santana tengo 17 años y eh realizado esta app

  </h3>

</section>
<section id="parametros" class="activa">
    <h2>Configurar Parámetros</h2>

    <label>Tasa de interés:</label>
    <input type="number" id="tasaInteres" min="10" max="20" value="15">
    <span>%</span>

    <br>

    <button onclick="guardarTasa()">Guardar tasa</button>

    <p id="mensajeTasa"></p>
</section>

<section id="clientes">
    <h2>Registro de Clientes</h2>

    <input type="text" id="cedula" placeholder="Cédula">
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="text" id="apellido" placeholder="Apellido">
    <input type="number" id="ingresos" placeholder="Ingresos">
    <input type="number" id="egresos" placeholder="Egresos">
    <input type="text" id="correo" placeholder="Correo Electronico">

    <br>

    <button onclick="guardarCliente()">Guardar cliente</button>
    <button onclick="limpiar()">Limpiar</button>

    <table>
        <thead>
            <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Ingresos</th>
                <th>Egresos</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaClientes">
        </tbody>
    </table>
</section>

<section id="credito">
    <h2>Solicitar Crédito</h2>

    <input
        type="text"
        id="buscarCedulaCredito"
        placeholder="Cédula del cliente"
    >

    <button onclick="buscarClienteCredito()">Buscar cliente</button>

    <div id="datosClienteCredito" class="card"></div>

    <input
        type="number"
        id="montoCredito"
        placeholder="Monto solicitado"
    >

    <input
        type="number"
        id="plazoCredito"
        placeholder="Plazo en años"
    >

    <br>

    <button onclick="calcularCredito()">Calcular crédito</button>

    <div id="resultadoCredito"></div>

    <button id="btnSolicitarCredito" onclick="solicitarCredito()" disabled>
        Solicitar crédito
    </button>
    <button id="btnAsignarCredito" onclick="asignarCredito()" disabled>Asignar Credito</button>
</section>

<script src="utilitarios.js"></script>
<script src="funciones.js"></script>
<script src="simulador_completo.js"></script>

</body>
</html>
